<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vue.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%- title %></title>
    <% if (isProd) { %>
    <script>
      if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        // SDK 配置参数：https://help.aliyun.com/zh/arms/user-experience-monitoring/web-h5-sdk-configuration-reference?spm=a2c4g.11186623.help-menu-34364.d_2_0_0_1.32817e09Gsr5jd
        window.__rum = {
          // Web & H5应用数据的上报地址
          endpoint:
            "https://proj-xtrace-6e4498cf7dbadac3f7ccfcd8e0d50d5-cn-hangzhou.cn-hangzhou.log.aliyuncs.com/rum/web/v2?workspace=default-cms-1519021304584285-cn-hangzhou&service_id=eyg4r4s50d@868f3e0f9ba9156eb9ccd",
          // 设置环境信息，参考值：'prod' | 'gray' | 'pre' | 'daily' | 'local'
          env: "prod",
          // 设置路由模式， 参考值：'history' | 'hash'
          spaMode: "history",
          collectors: {
            // 页面性能指标监听开关，默认开启
            perf: true,
            // WebVitals指标监听开关，默认开启
            webVitals: true,
            // Ajax监听开关，默认开启
            api: true,
            // 静态资源开关，默认开启
            staticResource: true,
            // JS错误监听开关，默认开启
            jsError: true,
            // 控制台错误监听开关，默认开启
            consoleError: true,
            // 用户行为监听开关，默认开启
            action: true
          },
          // 链路追踪配置开关，默认关闭
          tracing: false
        };
      }
      // 加载 ARMS SDK
      const script = document.createElement("script");
      script.src = "https://sdk.rum.aliyuncs.com/v2/browser-sdk.js";
      script.crossOrigin = "anonymous";
      script.async = true;
      document.head.appendChild(script);
    </script>
    <% } %>
  </head>
  <body>
    <div id="app">
      <style>
        html,
        body,
        #app {
          width: 100%;
          height: 100%;
          padding: 0;
          margin: 0;
        }
        .loading-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
        }
        .loading-box .loading-wrap {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 98px;
        }
        .dot {
          position: relative;
          box-sizing: border-box;
          display: inline-block;
          width: 32px;
          height: 32px;
          font-size: 32px;
          transform: rotate(45deg);
          animation: ant-rotate 1.2s infinite linear;
        }
        .dot i {
          position: absolute;
          display: block;
          width: 14px;
          height: 14px;
          background-color: #409eff;
          border-radius: 100%;
          opacity: 0.3;
          transform: scale(0.75);
          transform-origin: 50% 50%;
          animation: ant-spin-move 1s infinite linear alternate;
        }
        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }
        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          animation-delay: 0.4s;
        }
        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          animation-delay: 0.8s;
        }
        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          animation-delay: 1.2s;
        }

        @keyframes ant-rotate {
          to {
            transform: rotate(405deg);
          }
        }

        @keyframes ant-spin-move {
          to {
            opacity: 1;
          }
        }
      </style>
      <div class="loading-box">
        <div class="loading-wrap">
          <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
    </div>
    <script>
      const globalState = JSON.parse(window.localStorage.getItem("geeker-global"));
      if (globalState) {
        const dot = document.querySelectorAll(".dot i");
        const html = document.querySelector("html");
        dot.forEach(item => (item.style.background = globalState.primary));
        if (globalState.isDark) html.style.background = "#141414";
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
